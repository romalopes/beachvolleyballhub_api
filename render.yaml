# Render Blueprint for bvb-api (Rails 8, Docker, Neon Postgres).
# Minimal: deploy pipeline only. Tuning lives in Dockerfile / dashboard.

services:
  - type: web
    name: bvb-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Puma binds tcp://0.0.0.0:${PORT}; Render injects PORT=10000 automatically.
    # Keep in sync with config/puma.rb.
    healthCheckPath: /up
    preDeployCommand: "./bin/render-predeploy.sh"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        value: https://beachvolleyballhub.com
      - key: APP_HOST
        sync: false
      - key: MIGRATE_ON_BOOT
        value: "false"
      - key: GEOCODING_ENABLED
        value: "true"
      - key: GEOCODING_PROVIDER
        value: geoapify
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEOCODING_USER_AGENT
        sync: false
      - key: GEOCODING_OPEN_TIMEOUT
        value: "3"
      - key: GEOCODING_READ_TIMEOUT
        value: "5"
      - key: WEB_CONCURRENCY
        value: "1" # keep at 2 — 10 workers OOM a starter instance
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # Subscription billing (IDENTITY-116). Secrets and Price IDs are set in the
      # Render dashboard (sync: false) and never committed. APP_FRONTEND_URL falls
      # back to FRONTEND_URL when omitted.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLAYER_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_COACH_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_CLUB_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: APP_FRONTEND_URL
        value: https://beachvolleyballhub.com
      - key: BILLING_GRACE_PERIOD_DAYS
        value: "7"
      # Turn on only after the premium operations and catalogue are approved.
      - key: BILLING_ENFORCEMENT_ENABLED
        value: "false"
      # Public contact form (IDENTITY-259). Recipients are a comma-separated
      # list, deliberately separate from MAIL_REPLY_TO (a Reply-To header).
      - key: CONTACT_NOTIFICATION_EMAILS
        sync: false
      # Cloudflare Turnstile secret for server-side Siteverify. Production fails
      # closed when it is missing, so the contact form rejects every submission.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_EXPECTED_HOSTNAME
        sync: false

  # Solid Queue does not run in the Puma process. This continuously running
  # worker consumes every queue configured in config/queue.yml, including the
  # `background` queue used by login notifications and Rails' mailer queues.
  - type: worker
    name: bvb-api-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/jobs
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      - key: JOB_CONCURRENCY
        value: "1"
      # Migrations run once in the web service's pre-deploy command. Avoid a
      # web/worker boot race in bin/docker-entrypoint.
      - key: MIGRATE_ON_BOOT
        value: "false"
      - key: FRONTEND_URL
        value: https://beachvolleyballhub.com
      - key: APP_HOST
        sync: false
      - key: MAIL_TRANSPORT
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_DOMAIN
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTHENTICATION
        sync: false
      - key: SMTP_ENABLE_STARTTLS
        sync: false
      - key: IP2LOCATION_API_KEY
        sync: false
      - key: GEOCODING_ENABLED
        value: "true"
      - key: GEOCODING_PROVIDER
        value: geoapify
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEOCODING_USER_AGENT
        sync: false
      - key: GEOCODING_OPEN_TIMEOUT
        value: "3"
      - key: GEOCODING_READ_TIMEOUT
        value: "5"
      # Billing reconciliation (IDENTITY-116) runs from this worker and calls
      # Stripe, so it needs the secret key and the Price mapping.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PLAYER_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_COACH_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_CLUB_YEARLY_PRICE_ID
        sync: false
      - key: BILLING_GRACE_PERIOD_DAYS
        value: "7"
      # Contact-form delivery (IDENTITY-259) runs here too: the job sends the
      # notification email and publishes the in-app notification, so the worker
      # needs the same recipient list and mail configuration as the web service.
      - key: CONTACT_NOTIFICATION_EMAILS
        sync: false
