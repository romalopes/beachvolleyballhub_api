# Render Blueprint for bvb-api (Rails 8, Docker, Neon Postgres).
# Minimal: deploy pipeline only. Tuning lives in Dockerfile / dashboard.

services:
  - type: web
    name: bvb-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Puma binds tcp://0.0.0.0:${PORT}; Render injects PORT=10000 automatically.
    # Keep in sync with config/puma.rb.
    healthCheckPath: /up
    preDeployCommand: "./bin/render-predeploy.sh"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_HOST
        sync: false
      - key: MIGRATE_ON_BOOT
        value: "true"
