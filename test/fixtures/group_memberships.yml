# Phase 6 (Assessment Sessions), plan §2: roster rows.
#
# Keyed on a polymorphic `memberable` (§4.4). A subject is normally an Account,
# but an accountless PlayerProfile/CoachProfile can sit on a roster in its own
# right — the same way it can on an organisation roster.
#
# Both fixture groups carry an explicit owner, because ownership is a membership
# (§2.6) and a group without one cannot be managed by anybody.

u19_squad_pedro:
  group: u19_squad
  account: one
  memberable: one (Account)

# An unclaimed player can be rostered before an Account exists. The player detail
# endpoint must serialize this profile-held row rather than only account rows.
u19_squad_accountless_player:
  group: u19_squad
  memberable: pedro_player (PlayerProfile)

# users(:six) created u19_squad and owns it.
u19_squad_owner:
  group: u19_squad
  account: two
  memberable: two (Account)
  role: owner

# users(:three) created private_squad and owns it. That roster is otherwise left
# empty on purpose, because adding a member is what the tests do.
private_squad_owner:
  group: private_squad
  account: three
  memberable: three (Account)
  role: owner

sydney_club_squad_owner:
  group: sydney_club_squad
  account: two
  memberable: two (Account)
  role: owner

northern_club_squad_owner:
  group: northern_club_squad
  account: two
  memberable: two (Account)
  role: owner
